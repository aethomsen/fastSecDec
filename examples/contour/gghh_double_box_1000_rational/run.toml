right = "gghh::{spenso::tensor,spenso::rank1}::eps1"
symbol = "p2eps1"

[[kinematics.products]]
left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(2)"
right = "gghh::{spenso::tensor,spenso::rank1}::eps2"
symbol = "p2eps2"

[[kinematics.products]]
left = "gghh::{spenso::tensor,spenso::rank1}::eps1"
right = "gghh::{spenso::tensor,spenso::rank1}::eps1"
symbol = "eps1eps1"

[[kinematics.products]]
left = "gghh::{spenso::tensor,spenso::rank1}::eps1"
right = "gghh::{spenso::tensor,spenso::rank1}::eps2"
