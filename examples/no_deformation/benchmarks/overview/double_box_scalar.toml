# Scalar D05 at exact s=1000000, t=-97077, mH=125, mt=345/2.
# Native exported numerator/projector/prefactor/overall factor are one.
# Preparatory epsilon^0 card: benchmark recipes/executable remain separately frozen.
[input]
graph = "double_box_scalar.dot"
model = "../../../gghh_double_box/model.json"
parameter_card = "../../../gghh_double_box/parameters.json"
model_parameters = "fixed"

[integral]
dimension = "4-2*eps"
regulator = "eps"
measure_multiplier = "1"

[integral.powers]
"4" = 1
"5" = 1
"6" = 1
"7" = 1
"8" = 1
"9" = 1
"10" = 1

[kinematics]
auxiliary_momenta = [
  "gghh::{spenso::tensor,spenso::rank1}::eps1",
  "gghh::{spenso::tensor,spenso::rank1}::eps2",
]

[[kinematics.products]]
left = "gammalooprs::{spenso::rank1,spenso::tensor,spenso::component-labels:subscript,spenso::tensor-label:p}::P(0)"
right = "gammalooprs::{spenso::rank1,spenso::tensor,spenso::component-labels:subscript,spenso::tensor-label:p}::P(0)"
value = "0"

[[kinematics.products]]
left = "gammalooprs::{spenso::rank1,spenso::tensor,spenso::component-labels:subscript,spenso::tensor-label:p}::P(0)"
right = "gammalooprs::{spenso::rank1,spenso::tensor,spenso::component-labels:subscript,spenso::tensor-label:p}::P(1)"
value = "500000"

[[kinematics.products]]
left = "gammalooprs::{spenso::rank1,spenso::tensor,spenso::component-labels:subscript,spenso::tensor-label:p}::P(0)"
right = "gammalooprs::{spenso::rank1,spenso::tensor,spenso::component-labels:subscript,spenso::tensor-label:p}::P(2)"
value = "56351"

