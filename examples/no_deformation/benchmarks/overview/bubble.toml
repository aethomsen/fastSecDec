# Preparatory finite-coefficient card; native admission and campaign freeze pending.
[input]
graph = "../../../graphs/bubble.dot"
model = "../../../models/scalar.json"
model_parameters = "fixed"

[parameters]
"UFO::mt" = "sqrt(3)"

[integral]
dimension = "4-2*eps"
regulator = "eps"
measure_multiplier = "gamma(1-2*eps)/(gamma(1+eps)*gamma(1-eps)^2)"

[[kinematics.products]]
left = 1
right = 1
value = "16"

[generation]
order = 0
mode = "symbolic"
subtraction = "integrate_by_parts"
contour_jacobian = "symbolic"

[generation.coefficient_expansion]
method = "coefficient_series"
initial_relative_width = 2

[generation.evaluator]
backend = "symjit"
cpe_rounds = 1000
cores = 1

[integration]
method = "qmc"
workers = 25
points = 4096
shifts = 8
package_points = 1024
evaluation_batch_size = 256
lattice = "kuo33002"
periodization = "korobov3"
accuracy_target = { target = "laurent_order", order = 0 }
relative_tolerance = 1e-30
absolute_tolerance = 1e-30
double_points = false
contour_diagnostics = "disabled"

[integration.stability]
mode = "validated"
