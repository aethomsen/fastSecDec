[package]
name = "fastsecdec-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Optional native HEPKit Python bindings for FastSecDec"
repository = "https://github.com/alphal00p/fastSecDec"
publish = false

# Keep PyO3 and its feature graph outside the numerical workspace and CLI gates.
[workspace]
resolver = "3"

[lib]
crate-type = ["rlib"]

[features]
default = ["native"]
native = [
    "fastsecdec/native", "fastsecdec/threshold-decomposition", "feynkit-py/native", "symbolica/integer-gmp",
    "symbolica/float-mpfr", "symbolica/native_code_generation",
]
portable = ["fastsecdec/portable", "feynkit-py/wasm", "symbolica/wasm"]
python_stubgen = [
    "dep:pyo3-stub-gen", "feynkit-py/python_stubgen", "symbolica/python_stubgen",
]

[dependencies]
fastsecdec = { path = "../../crates/fastsecdec", default-features = false }
fastsecdec-sectors = { path = "../../crates/fastsecdec-sectors", default-features = false }
idenso = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-py = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["python_export"] }
# ABI and extension-module linking are owned by the consuming community host.
pyo3 = { version = "0.28", features = ["multiple-pymethods"] }
pyo3-stub-gen = { version = "0.17", optional = true, default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3"

# Standalone leaf builds use the same renderer sources as the community host.
# Consumer-root patches remain authoritative when this crate is a dependency.
[patch.crates-io]
graphica = { git = "https://github.com/symbolica-dev/symbolica", branch = "codex/community-evaluator-composition" }
# Share one public Symbolica owner across the HEPKit dependency graph.
symbolica = { git = "https://github.com/symbolica-dev/symbolica", branch = "codex/community-evaluator-composition" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", branch = "codex/community-evaluator-composition" }
symjit = { git = "https://github.com/ValentinHirschi/symjit_changes_for_pyamplicol", rev = "d74993ffd76a6fc322a7bcf3963fa786783a38a8" }
typst-library = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit" }
typst-svg = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }
