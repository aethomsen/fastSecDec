[package]
name = "fastsecdec-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface for FastSecDec"

[[bin]]
name = "fastsecdec"
path = "src/main.rs"

[dependencies]
feynkit-model.workspace = true
fastsecdec = { workspace = true, features = ["native", "threshold-decomposition"] }
symbolica.workspace = true
numerica.workspace = true
spenso.workspace = true
feynkit-graph.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rayon.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
tabled = { version = "0.22", default-features = false, features = ["std", "ansi"] }
signal-hook = "0.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
blake3.workspace = true
tempfile.workspace = true

[build-dependencies]
blake3.workspace = true
toml.workspace = true

[dev-dependencies]
idenso.workspace = true
libc = "0.2"
