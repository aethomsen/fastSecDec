[workspace]
members = ["crates/fastsecdec", "crates/fastsecdec-sectors", "crates/fastsecdec-qmc", "crates/fastsecdec-cli"]
exclude = ["DO_NOT_PUSH_FOR_REFERENCE_ONLY", "output", "tests/portable-kernel", "bindings/python"]
default-members = ["crates/fastsecdec-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
fastsecdec = { path = "crates/fastsecdec", default-features = false }
fastsecdec-sectors = { path = "crates/fastsecdec-sectors", default-features = false }
fastsecdec-qmc = { path = "crates/fastsecdec-qmc", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["serde", "bincode"] }
numerica = { version = "3.0.1", default-features = false, features = ["serde", "bincode"] }
# Keep a compatible minimum; the consumer patch below selects pending owner fixes.
symjit = "2.27.0"
symgcad = { git = "https://github.com/alphal00p/symgcad", rev = "3baffa7134334c62b45a6b8df9198004060be715" }
feynkit-graph = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-model = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-tensor = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
linnet = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false, features = ["serde", "bincode", "nodestore-vec"] }
idenso = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
spenso = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false, features = ["shadowing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
thiserror = "2.0"
toml = "0.9"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.11"
tempfile = "3"
blake3 = "1.8"
bincode = { version = "2.0.1", features = ["serde"] }

[patch.crates-io]
symbolica = { git = "https://github.com/ValentinHirschi/symbolica", rev = "ae0c82b7bda670fdb9f6229226bd47b13bb49a20" }
numerica = { git = "https://github.com/ValentinHirschi/symbolica", rev = "ae0c82b7bda670fdb9f6229226bd47b13bb49a20" }
symjit = { git = "https://github.com/ValentinHirschi/symjit_changes_for_pyamplicol", rev = "d74993ffd76a6fc322a7bcf3963fa786783a38a8" }
# Match HEPKit's optional Spenso Wasm dependency source; no plugin feature is selected.
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.dev.package.symbolica]
opt-level = 2

[profile.dev.package.numerica]
opt-level = 2

[profile.release]
lto = "thin"

# Keep all incoming HEPKit types on the tested native owner, including transitive Git edges.
[patch."https://github.com/alphal00p/gammaloop"]
feynkit-generator = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "9f8b1e50016a58d04e712c34569ea936c44e179a" }
feynkit-graph = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "9f8b1e50016a58d04e712c34569ea936c44e179a" }
feynkit-kinematics = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "9f8b1e50016a58d04e712c34569ea936c44e179a" }
feynkit-model = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "9f8b1e50016a58d04e712c34569ea936c44e179a" }
feynkit-tensor = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "9f8b1e50016a58d04e712c34569ea936c44e179a" }
idenso = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "9f8b1e50016a58d04e712c34569ea936c44e179a" }
linnet = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "9f8b1e50016a58d04e712c34569ea936c44e179a" }
spenso = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "9f8b1e50016a58d04e712c34569ea936c44e179a" }
